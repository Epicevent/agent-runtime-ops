[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-ops"
version = "0.1.0"
description = "Runtime operations, profiles, rollout, and monitoring for JI TECH agent services"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1.0",
  "PyMySQL[rsa]>=1.1.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
opsctl = "agent_runtime_ops.cli:main"
agent-runtime-ops-mcp = "agent_runtime_ops.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "opsctl"}

[tool.setuptools.packages.find]
where = ["opsctl"]
