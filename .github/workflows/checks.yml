name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install pytest

      - name: Compile Python
        run: python -m compileall opsctl

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Run embedded retrieval rollout contracts
        run: |
          python -m pytest -q \
            tests/test_hermes_p1_canary.py \
            tests/test_legacy_runtime_backup_migration.py \
            tests/test_retrieval_contract.py \
            tests/test_retrieval_resources.py \
            tests/test_runtime_env_transaction.py

      - name: Run root-action Linux contracts
        run: python -m pytest -q tests -k root_action

      - name: Run root-action root-ownership contract
        run: |
          sudo "$(command -v python)" -m pytest -q \
            tests/test_root_action_listener_posix.py::test_production_projection_permissions_are_root_trusted_group_only

      - name: Run legacy backup root-ownership contract
        run: |
          sudo "$(command -v python)" -m pytest -q \
            tests/test_legacy_runtime_backup_migration.py::test_legacy_file_owned_by_another_uid_fails_closed

      - name: Run restrictive-umask install ownership contract
        run: |
          python -m pytest -q tests/test_install_svcops_contract.py
          sudo "$(command -v python)" -m pytest -q \
            tests/test_install_svcops_contract_posix.py

      - name: Run svcops read-only observation contract
        run: python -m pytest -q tests/test_readonly_observation.py

      - name: List runtime profiles
        run: python -m agent_runtime_ops.cli profile list

      - name: Validate canonical runtime recipes
        run: |
          python -m agent_runtime_ops.cli recipe validate-canonical hermes-runtime
          python -m agent_runtime_ops.cli recipe validate-canonical hermes-workspace
          python -m agent_runtime_ops.cli recipe validate-canonical hermes-combined
          python -m agent_runtime_ops.cli recipe validate-canonical openclaw-control

      - name: Verify no legacy compose repair path
        run: |
          set -euo pipefail
          ! grep -RInE 'docker-compose\.nas\.yml|svcops-control\.sh|cat > .*docker-compose' \
            --exclude-dir=.git \
            --exclude-dir=tests \
            --exclude=checks.yml .
