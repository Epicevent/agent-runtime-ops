name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install pytest

      - name: Compile Python
        run: python -m compileall opsctl

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: List runtime profiles
        run: python -m agent_runtime_ops.cli profile list

      - name: Validate canonical runtime recipes
        run: |
          python -m agent_runtime_ops.cli recipe validate-canonical hermes-runtime
          python -m agent_runtime_ops.cli recipe validate-canonical hermes-workspace
          python -m agent_runtime_ops.cli recipe validate-canonical hermes-combined
          python -m agent_runtime_ops.cli recipe validate-canonical openclaw-control

      - name: Verify no legacy compose repair path
        run: |
          set -euo pipefail
          ! grep -RInE 'docker-compose\.nas\.yml|svcops-control\.sh|cat > .*docker-compose' \
            --exclude-dir=.git \
            --exclude-dir=tests \
            --exclude=checks.yml .
