id: hermes-dev
family: hermes
mode: source
slot_class: dev
service: openclaw-gateway
runtime_contract: hermes-workspace-source-http-3000
customer_surface: workspace-ui@3000
expected_image_components:
  - hermes-workspace-server
  - hermes-gateway
  - hermes-dashboard
compatible_product_image_prefixes:
  - "ghcr.io/epicevent/hermes-workspace@sha256:"
  - "ghcr.io/epicevent/openclaw-nas-agent@sha256:"
container_nas_root: /workspace/nas_docs
allow_source_mount: true
source_output_target: /opt/hermes-workspace
required_mount_propagation: rslave
required_read_only_nas: true
runtime_user_mode: image-managed
required_command:
  - gateway
  - run
image_default_command_product_components:
  - hermes-workspace
working_dir_by_product_component:
  hermes-workspace: /app
  default: /opt/data/home
http_smoke_path: /
required_http_container_port: 3000
startup_timeout_seconds: 240
