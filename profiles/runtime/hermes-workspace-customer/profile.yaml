id: hermes-workspace-customer
family: hermes
mode: image
slot_class: customer
service: openclaw-gateway
runtime_contract: hermes-workspace-http-3000
customer_surface: workspace-ui@3000
product_component: hermes-workspace
expected_image_components:
  - hermes-workspace-server
  - hermes-gateway
  - hermes-dashboard
compatible_product_image_prefixes:
  - "ghcr.io/epicevent/hermes-workspace@sha256:"
container_nas_root: /workspace/nas_docs
allow_source_mount: false
required_mount_propagation: rslave
required_read_only_nas: true
runtime_user_mode: image-managed
image_default_command: true
required_working_dir: /app
http_smoke_path: /
required_http_container_port: 3000
startup_timeout_seconds: 240
container_workspace_root: /workspace/ocn
